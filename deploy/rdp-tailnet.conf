# Optional Jetson-only drop-in: b2-rdp.service.d/tailnet.conf.
# Install the reviewed readiness helper and private tailnet-address file first.
[Unit]
Wants=tailscaled.service
After=tailscaled.service
StartLimitIntervalSec=0

[Service]
ExecStartPre=/usr/bin/python3 /opt/b2-remote/libexec/rdp-tailnet-ready.py
Restart=on-failure
RestartSec=5s
